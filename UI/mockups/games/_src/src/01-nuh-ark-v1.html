<!DOCTYPE html>
<!--
  GAME MOCKUP 01 - Nuh and the Ark (prototype, not linked from the hub)
  Learning goal: After playing, the child can say that Nuh kept building the ark patiently, trusting Allah,
  even when people laughed, and that persisting in good work pays off.
  Core loop: drag a plank onto the next row of the ark and press-and-hold to hammer it firm while mocking
  words drift by (keep going), then drag the animals onto the ramp two by two; the rain comes and the ark floats.
  Story source: UI/story-prophet-nuh.html. Dua copied from that page. No prophet, angel, person or face is drawn:
  the mockers are only distant tents, lantern-lights and their words (scholar gate 1, 2026-11-03).
  The Biblical dove and olive leaf are removed; the ending keeps to 11:44 (the ark rests on Judi).
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuh and the Ark - game prototype - Islamic Kids</title>
<style>
{{COMMON_CSS}}
/* ========== ART / SCENE STYLES (placeholder art; swap freely - game logic only uses the ids and classes) ========== */
.scene{background:linear-gradient(#a9d6e5,#f3e9d6 70%);transition:background 1.5s ease}
.scene.stormy{background:linear-gradient(#5f7480,#a8b4b8 70%)}
.scene.clear{background:linear-gradient(#bfe3ef,#fbf6ea 75%)}
#ark{position:absolute;inset-inline-start:36%;width:54%;bottom:12%;height:44%;z-index:3;transition:transform 2.5s ease}
#ark.afloat{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
#hull{position:absolute;bottom:0;left:0;right:0;height:68%;display:flex;flex-direction:column-reverse;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);background:repeating-linear-gradient(90deg,transparent 0 11%,rgba(94,66,18,.55) 11% 12.2%);border-top:3px dashed rgba(94,66,18,.5)}
.slot{flex:1;border:none;border-top:2px dashed rgba(94,66,18,.35);background:transparent;position:relative;min-height:24px;transition:background .3s,transform .3s}
.slot.next{background:rgba(224,183,92,.35)}
#hull.drop-hot .slot.next,#hull.drop-hint .slot.next{background:var(--gold-light)}
#hull.drop-hot{box-shadow:none!important}
#hull{cursor:pointer}
.slot.loose{background:linear-gradient(#b07a3c,#8a5a26);transform:rotate(-1.6deg) translateY(-3px);opacity:.9}
.slot.loose::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:calc(var(--p,0)*100%);background:rgba(255,255,255,.28)}
.slot.fixed{background:linear-gradient(#a8743a,#7d5222),repeating-linear-gradient(90deg,transparent 0 30px,rgba(0,0,0,.08) 30px 32px);background-blend-mode:multiply;border-top:2px solid #5E4212}
#cabin{position:absolute;bottom:68%;inset-inline-start:22%;width:56%;height:32%;background:linear-gradient(#9b6a33,#7d5222);border:3px solid #5E4212;border-bottom:none;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:space-around;padding:0 .3rem}
#cabin[hidden]{display:none}
.win{width:22%;height:62%;background:#fbf0d4;border:3px solid #5E4212;border-radius:10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;font-size:clamp(.8rem,2vw,1.15rem);line-height:1.1;overflow:hidden}
#pile{position:absolute;inset-inline-start:4%;bottom:6%;width:26%;height:24%;z-index:4;display:flex;align-items:flex-end;justify-content:center}
.stack{position:absolute;bottom:0;width:80%;height:30px;border-radius:6px;background:linear-gradient(#a8743a,#7d5222);opacity:.55}
.stack.s2{bottom:12px;width:74%}
.plank{position:relative;z-index:2;width:clamp(110px,18vw,170px);height:52px;border-radius:10px;background:linear-gradient(#c58d4a,#8a5a26);border:3px solid #5E4212;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.3rem;margin-bottom:34px;box-shadow:0 6px 0 #5E4212}
.plank[hidden]{display:none}
#taunts{position:absolute;inset:0;pointer-events:none;z-index:6}
.taunt{position:absolute;left:6%;top:16%;max-width:38%;background:rgba(255,255,255,.88);border:2px solid #9aa5a6;border-radius:20px;padding:.45rem .8rem;font-weight:700;color:#3d4d4f;pointer-events:auto;cursor:pointer;min-height:48px;transition:opacity 1s ease,transform 1s ease;animation:drift 6s ease-in-out infinite}
.taunt::after{content:"";position:absolute;bottom:-10px;left:22px;border:10px solid transparent;border-top-color:#9aa5a6;border-bottom:0}
.taunt.fade{opacity:0;transform:translateY(-30px) scale(.9)}
@keyframes drift{50%{transform:translateX(10px)}}
#ramp{position:absolute;inset-inline-start:22%;bottom:10%;width:16%;min-width:120px;height:26%;z-index:5;border:3px dashed var(--gold);border-radius:18px;background:rgba(255,253,248,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;font-weight:800;cursor:pointer;padding:.2rem}
#ramp[hidden]{display:none}
#ramp .seats{display:flex;gap:.3rem}
.seat{width:52px;height:52px;border-radius:50%;border:2px dashed var(--rule-strong);display:flex;align-items:center;justify-content:center;font-size:1.9rem;background:var(--card)}
#meadow{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;background:linear-gradient(#e3efc8,#cfe0a8);border:2px solid #9fbf6a}
#meadow[hidden]{display:none}
.animal{width:68px;height:68px;border-radius:50%;background:var(--card);border:3px solid #9fbf6a;font-size:2.3rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md)}
.animal.gone{visibility:hidden}
#rain{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 1.5s;background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(255,255,255,.55) 22px 24px);background-size:200px 200px;animation:rain .6s linear infinite}
.stormy #rain{opacity:.7}
@keyframes rain{to{background-position:-40px 200px}}
#water:not(.on){display:none}
#water{position:absolute;left:0;right:0;bottom:0;height:0;z-index:2;background:linear-gradient(rgba(36,80,140,.75),rgba(27,60,107,.9));transition:height 3s ease;cursor:pointer}
#water::before{content:"";position:absolute;top:-12px;left:0;right:0;height:24px;background:radial-gradient(circle at 20px 24px,transparent 14px,rgba(36,80,140,.75) 15px) 0 0/40px 24px repeat-x}
.ripple{position:absolute;width:20px;height:20px;border:3px solid rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-50%);animation:rip 1s ease-out forwards;pointer-events:none;z-index:8}
@keyframes rip{to{width:120px;height:40px;opacity:0}}
#judi{position:absolute;left:30%;right:4%;bottom:0;height:0;z-index:1;background:linear-gradient(#8f9f6a,#6f7d4e);clip-path:polygon(0 100%,35% 10%,60% 0,100% 100%);transition:height 3s ease}
#mockers{transition:opacity 2s}
.lamp{animation:lampPulse 4s ease-in-out infinite}
@keyframes lampPulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.lamp{animation:none}}
#ark.settling{cursor:pointer}
#hammerWrap{display:flex;align-items:center;gap:.8rem}
#hammerWrap[hidden]{display:none}
@media (max-width:600px){
  #ark{inset-inline-start:30%;width:68%;height:36%}
  #pile{width:34%;inset-inline-start:2%}
  #ramp{inset-inline-start:3%;bottom:40%;width:40%}
  .taunt{max-width:70%}
}
</style>
</head>
<body>
{{TOP}}
<main id="stage">
  <div class="scene" id="scene" aria-label="A dry valley far from the sea, with an unfinished ark" data-ar-label="وادٍ جاف بعيد عن البحر، وفيه سفينة لم تكتمل">
    <svg class="bg" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <circle id="sun" cx="860" cy="110" r="46" fill="#E0B75C" opacity=".9"/>
      <path d="M0 380 Q120 270 260 330 T520 360 L520 625 L0 625Z" fill="#c9b98f"/>
      <!-- the mockers are never drawn as people: only distant tents and their lantern-lights -->
      <g id="mockers" opacity=".75">
        <path d="M100 330 L122 296 L144 330Z" fill="#8a7a5c"/><path d="M118 330 L122 312 L126 330Z" fill="#5e5140"/>
        <path d="M150 326 L168 300 L186 326Z" fill="#9a8a68"/><path d="M164 326 L168 312 L172 326Z" fill="#5e5140"/>
        <circle class="lamp" cx="140" cy="318" r="3.5" fill="#E0B75C"/><circle class="lamp" cx="190" cy="314" r="3" fill="#E0B75C"/>
      </g>
      <path d="M0 470 Q250 440 500 465 T1000 455 L1000 625 L0 625Z" fill="#d8c79c"/>
      <path d="M0 540 Q300 520 600 545 T1000 535 L1000 625 L0 625Z" fill="#c7b585"/>
    </svg>
    <span class="phase-tag" id="phaseTag"></span>
    <div id="judi" aria-hidden="true"></div>
    <div id="water" aria-hidden="true"></div>
    <div id="ark">
      <div id="cabin" hidden><div class="win"></div><div class="win"></div><div class="win"></div></div>
      <div id="hull"></div>
    </div>
    <div id="pile">
      <div class="stack" aria-hidden="true"></div><div class="stack s2" aria-hidden="true"></div>
      <div class="plank" id="plank" aria-label="A wooden plank: drag it to the ark" data-ar-label="لوح خشبي: اسحبه إلى السفينة">🪵 <span data-ar="لوح">Plank</span></div>
    </div>
    <button id="ramp" type="button" hidden aria-label="The ramp into the ark" data-ar-label="المنحدر إلى السفينة">
      <span data-ar="المنحدر">Ramp</span>
      <span class="seats"><span class="seat" id="seat0"></span><span class="seat" id="seat1"></span></span>
    </button>
    <div id="taunts" aria-live="polite"></div>
    <div id="rain" aria-hidden="true"></div>
  </div>
  {{NARR}}
  <div class="row">
    <div id="hammerWrap" hidden>
      <button class="hold" id="hammer" type="button" aria-label="Hold to hammer the plank" data-ar-label="اضغط مطوّلاً لتثبيت اللوح"><span class="ring"></span>🔨</button>
      <strong data-ar="اضغط مطوّلاً لتطرق اللوح">Hold to hammer</strong>
    </div>
  </div>
  <div class="choices" id="choices" hidden></div>
  <div class="panel" id="meadow" hidden aria-label="The meadow of animals" data-ar-label="مرج الحيوانات"></div>
  <div class="row" id="nextRow" hidden><button class="btn gold" id="nextBtn" type="button"></button></div>
</main>
{{BOTTOM}}
<script>
{{COMMON_JS}}
/* ================= Nuh game ================= */
const ROWS = 6;
const TAUNTS = [
  { en: 'A boat? There is no sea here!', ar: 'سفينة؟ لا يوجد بحر هنا!' },
  { en: 'Why work so hard? It will never float!', ar: 'لماذا تتعب نفسك؟ لن تطفو أبداً!' },
  { en: 'Ha! Building a ship on dry land!', ar: 'ها! يبني سفينة على اليابسة!' }
];
const ANIMALS = [
  ['🐘', { en: 'elephant', ar: 'فيل' }, { en: 'elephants', ar: 'الفيلة' }], ['🦁', { en: 'lion', ar: 'أسد' }, { en: 'lions', ar: 'الأسود' }],
  ['🐪', { en: 'camel', ar: 'جمل' }, { en: 'camels', ar: 'الجمال' }], ['🐑', { en: 'sheep', ar: 'خروف' }, { en: 'sheep', ar: 'الخراف' }],
  ['🦒', { en: 'giraffe', ar: 'زرافة' }, { en: 'giraffes', ar: 'الزرافات' }], ['🐇', { en: 'rabbit', ar: 'أرنب' }, { en: 'rabbits', ar: 'الأرانب' }],
  ['🐢', { en: 'tortoise', ar: 'سلحفاة' }, { en: 'tortoises', ar: 'السلاحف' }], ['🐦', { en: 'bird', ar: 'طائر' }, { en: 'birds', ar: 'الطيور' }],
  ['🐄', { en: 'cow', ar: 'بقرة' }, { en: 'cows', ar: 'الأبقار' }], ['🐐', { en: 'goat', ar: 'ماعز' }, { en: 'goats', ar: 'الماعز' }]
];
const S = {};
function reset() {
  Object.assign(S, { row: 0, loose: false, kept: 0, pairs: 0, total: G.tier ? 8 : 5, seat: null, phase: 'build' });
  const scene = $('#scene'); scene.className = 'scene';
  $('#hull').innerHTML = ''; $('#taunts').innerHTML = '';
  for (let i = 0; i < ROWS; i++) {
    const b = document.createElement('div'); b.className = 'slot'; b.dataset.i = i; $('#hull').appendChild(b);
  }
  $('#cabin').hidden = true; $$('.win').forEach(w => (w.textContent = ''));
  $('#plank').hidden = false; $('#pile').hidden = false; $('#ramp').hidden = true; $('#meadow').hidden = true;
  $('#water').style.height = '0'; $('#water').classList.remove('on'); $('#judi').style.height = '0'; $('#ark').classList.remove('afloat'); $('#ark').style.transform = '';
  $('#mockers').style.opacity = '.75'; $('#nextRow').hidden = true; $('#choices').hidden = true;
  markNext(); phase({ en: '1 · Build the ark', ar: '١ · ابنِ السفينة' });
  say({ en: 'Allah told Prophet Nuh to build a huge ark, far from any sea. Drag the plank onto the ark: it goes on the glowing row, from the bottom up.', ar: 'أمر الله النبيَّ نوحاً عليه السلام أن يبني سفينة ضخمة بعيداً عن البحر. اسحب اللوح إلى السفينة: يوضع في الصف المضيء، من الأسفل إلى الأعلى.' });
}
let phaseObj = null;
function phase(o) { phaseObj = o; $('#phaseTag').textContent = t(o); }
/* patience is never counted or scored (scholar ruling): the ark simply glows when the work goes on */
function arkGlow() { fx($('#ark'), 'glow'); }
function slotLabels() {
  $('#hull').setAttribute('aria-label', t({ en: `The ark: ${S.row} of ${ROWS} rows built. Place the plank here.`, ar: `السفينة: بُني ${num(S.row)} من ${num(ROWS)} صفوف. ضع اللوح هنا.` }));
}
dropTarget($('#hull'));
function markNext() { $$('.slot').forEach((s, i) => s.classList.toggle('next', i === S.row && !S.loose)); slotLabels(); }

/* ---- building ---- */
draggable($('#plank'), {
  targets: () => (S.phase === 'build' && !S.loose ? [$('#hull')] : []),
  onDrop: () => {
    const slot = $$('.slot')[S.row];
    S.loose = true; slot.classList.add('loose'); slot.classList.remove('next'); chime('thud'); sparkle(slot, 5);
    $('#plank').hidden = true; $('#hammerWrap').hidden = false; hammer.reset();
    say({ en: 'Good! Now press and hold the hammer to fix the plank firmly. Slow and steady.', ar: 'أحسنت! والآن اضغط مطوّلاً على المطرقة لتثبّت اللوح جيداً. بهدوء وثبات.' });
    setTimeout(() => $('#hammer').focus({ preventScroll: true }), 50);
  },
  onMiss: () => say({ en: 'Bring the plank right onto the ark.', ar: 'ضع اللوح فوق السفينة.' })
});
let lastTick = 0;
const hammer = holdButton($('#hammer'), 1500, p => {
  const slot = $$('.slot')[S.row]; if (slot) slot.style.setProperty('--p', p);
  const k = Math.floor(p * 5); if (k !== lastTick) { lastTick = k; chime('thud'); fx($('#hammer'), 'bounce'); }
}, () => plankFixed());
async function plankFixed() {
  const slot = $$('.slot')[S.row];
  slot.classList.remove('loose'); slot.classList.add('fixed'); chime('good'); sparkle(slot, 10); lastTick = 0;
  $('#hammerWrap').hidden = true; S.loose = false; S.row++;
  // anyone still taunting fades away once the work goes on
  const old = $$('.taunt:not(.fade)');
  if (old.length) { old.forEach(x => x.classList.add('fade')); arkGlow(); setTimeout(() => old.forEach(x => x.remove()), 1100); }
  if (S.row >= ROWS) return built();
  if (S.row === 1) await firstTaunt();
  else if (S.row === 3 || S.row === 5) showTaunt(TAUNTS[S.row === 3 ? 1 : 2]);
  $('#plank').hidden = false; markNext();
  if (S.row > 1) say(S.row === 3 || S.row === 5
    ? { en: 'More mocking words... Nuh did not stop. Keep building: drag the next plank.', ar: 'كلمات سخرية أخرى... لكن نوحاً لم يتوقف. واصل البناء: اسحب اللوح التالي.' }
    : { en: `Plank ${S.row} is firm. Drag the next plank.`, ar: `اللوح ${num(S.row)} ثابت. اسحب اللوح التالي.` });
}
function showTaunt(o) {
  const d = document.createElement('button'); d.type = 'button'; d.className = 'taunt'; d.__o = o; d.textContent = t(o);
  d.style.top = (10 + Math.random() * 14) + '%';
  d.addEventListener('click', () => { chime('soft'); say({ en: 'Those are mocking words. They cannot stop good work. Nuh kept doing what Allah asked, so we keep building too.', ar: 'هذه كلمات سخرية، ولا تستطيع أن توقف العمل الطيب. ظل نوح يفعل ما أمره الله، فلنواصل البناء نحن أيضاً.' }); });
  $('#taunts').appendChild(d); chime('soft');
}
async function firstTaunt() {
  showTaunt(TAUNTS[0]);
  say({ en: 'Some people on the hill are laughing at the ark. What should we do?', ar: 'بعض الناس على التل يضحكون من السفينة. ماذا نفعل؟' });
  for (;;) {
    const c = await ask($('#choices'), [
      { id: 'keep', ic: '🔨', label: { en: 'Keep building, trusting Allah', ar: 'نواصل البناء ونتوكل على الله' } },
      { id: 'stop', ic: '🛑', label: { en: 'Stop, they are laughing', ar: 'نتوقف، إنهم يضحكون' } }
    ]);
    if (c === 'keep') { chime('good'); $$('.taunt').forEach(x => x.classList.add('fade')); arkGlow(); say({ en: 'Yes! Nuh kept going, because Allah had asked him to. Drag the next plank.', ar: 'نعم! واصل نوح العمل لأن الله أمره بذلك. اسحب اللوح التالي.' }); return; }
    chime('soft'); fx($('#ark'), 'wobble');
    say({ en: 'If we stop, the ark stays half built, and it will be needed soon. Laughing cannot hurt the work. Let us choose again.', ar: 'إن توقفنا بقيت السفينة نصف مبنية، وسنحتاجها قريباً. الضحك لا يضرّ العمل. لنختر مرة أخرى.' });
    await wait(2600);
  }
}
async function built() {
  slotLabels(); $('#pile').hidden = true; $$('.taunt').forEach(x => x.remove()); $('#mockers').style.opacity = '.25';
  $('#cabin').hidden = false; sparkle($('#ark'), 12); chime('done');
  say({ en: 'The ark is built! Nuh worked patiently, plank by plank, even when people laughed.', ar: 'اكتملت السفينة! عمل نوح بصبر لوحاً بعد لوح، حتى حين ضحك الناس.' });
  await wait(1800);
  await pausePoint({ en: 'Nuh kept building even when people laughed. Has anyone ever laughed at something good you were doing? What helped you keep going?', ar: 'واصل نوح البناء حتى حين ضحك الناس. هل ضحك أحد يوماً من شيء طيب كنت تفعله؟ ما الذي ساعدك على الاستمرار؟' },
    { en: 'Idea: we keep doing good because Allah sees it, not because people clap.', ar: 'فكرة: نستمر في فعل الخير لأن الله يرانا، لا لأن الناس يصفقون لنا.' });
  startAnimals();
}

/* ---- two by two ---- */
function startAnimals() {
  S.phase = 'animals'; phase({ en: '2 · Two by two', ar: '٢ · زوجين زوجين' });
  const kinds = shuffle(ANIMALS).slice(0, S.total);
  const tokens = shuffle(kinds.flatMap(k => [k, k]));
  const m = $('#meadow'); m.innerHTML = ''; m.hidden = false; $('#ramp').hidden = false; S.seat = null; seatsRender();
  tokens.forEach(([e, name, plural]) => {
    const a = document.createElement('div'); a.className = 'animal'; a.textContent = e; a.dataset.e = e; a.__n = name; a.__p = plural;
    a.setAttribute('aria-label', t(name));
    draggable(a, { targets: () => [$('#ramp')], onDrop: (el) => toRamp(el) });
    m.appendChild(a);
  });
  say({ en: 'Allah told Nuh to bring a pair of every animal. Drag an animal onto the ramp, then find its partner.', ar: 'أمر الله نوحاً أن يحمل زوجين من كل حيوان. اسحب حيواناً إلى المنحدر، ثم ابحث عن شريكه.' });
}
onLang(() => { $$('.animal').forEach(a => a.setAttribute('aria-label', t(a.__n))); $$('.taunt').forEach(d => (d.textContent = t(d.__o))); if (phaseObj) $('#phaseTag').textContent = t(phaseObj); slotLabels(); if (!$('#nextRow').hidden && $('#nextBtn').__o) $('#nextBtn').textContent = t($('#nextBtn').__o); });
dropTarget($('#ramp'));
function seatsRender() { $('#seat0').textContent = S.seat ? S.seat.dataset.e : ''; $('#seat1').textContent = ''; }
$('#seat0').addEventListener('click', e => {
  if (S.seat && !G.sel) { e.stopPropagation(); S.seat.classList.remove('gone'); S.seat = null; seatsRender(); chime('tap'); say({ en: 'Okay, that one went back to the meadow. Pick any animal.', ar: 'حسناً، عاد إلى المرج. اختر أي حيوان.' }); }
});
async function toRamp(a) {
  if (!S.seat) {
    S.seat = a; a.classList.add('gone'); seatsRender(); chime('tap'); fx($('#seat0'), 'bounce');
    say({ en: `Now find its partner: another ${t(a.__n)} ${a.dataset.e}.`, ar: `والآن ابحث عن شريكه المطابق ${a.dataset.e} في المرج.` });
    return;
  }
  if (a.dataset.e !== S.seat.dataset.e) {
    chime('soft'); fx(a, 'wobble');
    say({ en: `This ${t(a.__n)} needs a partner of its own kind. Who matches the ${S.seat.dataset.e} on the ramp?`, ar: `هذا ${a.dataset.e} يحتاج إلى شريك من نوعه. من يطابق ${S.seat.dataset.e} الذي على المنحدر؟` });
    return;
  }
  a.classList.add('gone'); $('#seat1').textContent = a.dataset.e; chime('good'); sparkle($('#ramp'), 8);
  const w = $$('.win')[S.pairs % 3]; await anim(400);
  w.textContent += a.dataset.e + a.dataset.e; fx(w, 'glow'); seatsRender(); S.seat = null; S.pairs++;
  if (S.pairs >= S.total) return rain();
  const left = S.total - S.pairs;
  say({ en: `Two ${t(a.__p)} are safely aboard! ${left} more ${left === 1 ? 'pair' : 'pairs'} to go.`, ar: `صعد زوجٌ من ${t(a.__p)} بأمان! ` + (left === 1 ? 'بقي زوجٌ واحد.' : left === 2 ? 'بقي زوجان.' : `بقيت ${num(left)} أزواج.`) });
}

/* ---- the flood ---- */
async function rain() {
  S.phase = 'flood'; $('#meadow').hidden = true; $('#ramp').hidden = true; phase({ en: '3 · The rain', ar: '٣ · المطر' });
  say({ en: 'Every pair is aboard. Then the rain began, more rain than anyone had ever seen!', ar: 'صعدت كل الأزواج. ثم بدأ المطر، مطرٌ لم يرَ أحد مثله قط!' });
  await anim(1200); $('#scene').classList.add('stormy'); $('#mockers').style.opacity = '0';
  $('#water').classList.add('on'); await anim(1500); $('#water').style.height = '58%'; $('#ark').style.transform = 'translateY(-82%)';
  await anim(3000); $('#ark').classList.add('afloat');
  say({ en: 'Water covered the earth, but the ark floated safely with everyone inside. Tap the waves if you like.', ar: 'غطى الماء الأرض، لكن السفينة طفت بأمان وكل من فيها. المس الأمواج إن أحببت.' });
  await wait(3500);
  $('#scene').classList.replace('stormy', 'clear');
  S.phase = 'settle'; $('#ark').classList.add('settling');
  say({ en: 'After many days, Allah commanded the rain to stop and the water to go down. Tap the ark to watch where it comes to rest.', ar: 'وبعد أيام كثيرة أمر الله المطر أن يتوقف والماء أن ينحسر. المس السفينة لترى أين تستقر.' });
  const nb = $('#nextBtn'); nb.__o = { en: '⛰️ Watch the ark come to rest', ar: '⛰️ شاهد السفينة تستقر' }; nb.textContent = t(nb.__o);
  nb.onclick = settle; $('#nextRow').hidden = false; nb.focus({ preventScroll: true });
}
$('#ark').addEventListener('click', () => { if (S.phase === 'settle') settle(); });
$('#water').addEventListener('pointerdown', e => {
  if (S.phase !== 'flood') return; const r = $('#scene').getBoundingClientRect();
  const d = document.createElement('span'); d.className = 'ripple'; d.style.left = (e.clientX - r.left) + 'px'; d.style.top = (e.clientY - r.top) + 'px';
  $('#scene').appendChild(d); chime('tap'); setTimeout(() => d.remove(), 1000);
});
/* 11:44: the water went down and the ark came to rest on Judi. The child watches; Allah commanded it. */
async function settle() {
  if (S.phase !== 'settle') return; S.phase = 'rest'; chime('tap');
  $('#nextRow').hidden = true; $('#ark').classList.remove('settling');
  $('#water').style.height = '6%'; $('#judi').style.height = '40%'; $('#ark').classList.remove('afloat'); $('#ark').style.transform = 'translateY(-64%)';
  say({ en: 'The ark came to rest safely on a mountain called Judi. Prophet Nuh thanked Allah for keeping them safe.', ar: 'فاستقرت السفينة بسلام على جبل اسمه الجودي. فحمد النبي نوح الله على نجاتهم.' });
  await anim(3200); sparkle($('#ark'), 8);
  await pausePoint({ en: 'Why do you think Nuh trusted Allah, even when there was no sea nearby?', ar: 'لماذا برأيك وثق نوح بالله، مع أنه لم يكن هناك بحر قريب؟' },
    { en: 'Idea: Allah always keeps His promise, so doing what He asks is always worth it.', ar: 'فكرة: الله يفي بوعده دائماً، ففعل ما يأمر به يستحق العناء دائماً.' });
  showEnding({
    art: '⛰️🚢',
    title: { en: 'Safe, by Allah\'s mercy', ar: 'في أمان، برحمة الله' },
    body: { en: `You helped build the ark, plank by plank, and you kept building when people laughed. You helped ${S.pairs} pairs of animals aboard. Prophet Nuh was patient and trusted Allah.`, ar: `ساعدت في بناء السفينة لوحاً بعد لوح، وواصلت البناء حين ضحك الناس، وساعدت ${num(S.pairs)} أزواج من الحيوانات على الصعود. كان النبي نوح عليه السلام صابراً واثقاً بالله.` },
    extra: () => document.getElementById('duaTpl').innerHTML,
    tier: { en: 'Next time: more animals (8 pairs)', ar: 'في المرة القادمة: حيوانات أكثر (٨ أزواج)' }
  });
}
wireEnding(reset);
reset(); initShell();
</script>
<template id="duaTpl">
  <div class="duabox">
    <p class="hint">{{T:NUH_HEAD}}</p>
    <p class="scripture" lang="ar">{{S:NUH_DUA}}</p>
    <p>{{T:NUH_TR}}</p>
  </div>
</template>
</body>
</html>
