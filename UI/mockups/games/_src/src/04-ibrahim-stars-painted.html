<!DOCTYPE html>
<!--
  GAME 04 - Ibrahim: Stars and Guests. The third painted game (2026-11-07). Lives at UI/games/ibrahim-stars.html
  (built from this file by UI/mockups/games/_src/build.py). NOT linked from the story or the hub until the scholar's
  gates 2 (art) and 3 (build) pass. The CSS-shape mockup stays at mockups/games/04-ibrahim-stars.html.
  Learning goal: After playing, the child can explain that the star, the moon and the sun all set, so they are
  creations and not worthy of worship, and that only Allah who made them is; and can name ways Ibrahim honoured his
  guests (peace answered with peace, hurrying, the best food, brought near, a gentle invitation).
  Core loop: watch a light in the sky, let time pass until it sets, answer a factual question ("Did it stay with us
  all the time?"); then help welcome guests step by step, only as 51:25-27 and 11:69 tell it.
  Gate-1 rulings kept (claudeteam/reviews/game-ibrahim-stars.md): no option affirms that a star is our Lord; Ibrahim
  is teaching his people (6:76-79), not searching, and the game never says "this is my lord"; the sun, moon and stars
  have no faces; "never goes away and never sleeps ... always with us, hearing and seeing"; the guests round follows
  51:25-27 / 11:69 only (no water step), the guests are never drawn, nothing shows the food being eaten, and the
  grown-up is told they were angels and angels do not eat. No idols, no fire, no Ka'bah in this game.
  Art: UI/images/games/ibrahim/ (prompts and seeds: UI/scripts/specs/games/ibrahim.py, claudeteam/reviews/game-ibrahim-art.md).
  Engine: painted DOM planes + DOM HUD, one PixiJS canvas for star twinkle and motes
  (claudeteam/reviews/game-engine-choice-2026-11-04.md). The story sentences and the dua are copied from the story page.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14383A">
<title>Ibrahim: Stars and Guests - Islamic Kids</title>
<link rel="preload" href="../images/games/ibrahim/plate-night-land.webp" as="image" media="(min-aspect-ratio: 4/5)">
<link rel="preload" href="../images/games/ibrahim/plate-night-port.webp" as="image" media="(max-aspect-ratio: 4/5)">
<link rel="stylesheet" href="ibrahim/ibrahim.css">
</head>
<body>
<div id="app" class="phase-sky">
  <!-- ================= the world: painted planes, props and the atmosphere canvas ================= -->
  <div id="viewport">
    <div id="world" role="group" aria-label="The desert at night" data-ar-label="الصحراء في الليل">
      <div class="plates" aria-hidden="true">
        <img class="plate on" data-state="night" alt="" decoding="async">
        <img class="plate" data-state="morning" alt="" decoding="async">
        <img class="plate" data-state="evening" alt="" decoding="async">
        <img class="plate" data-state="tent" alt="" decoding="async">
      </div>
      <div class="dim" aria-hidden="true"></div>
      <!-- the canvas sits under every prop (Nuh/Musa lesson): twinkle and motes never cover a sprite -->
      <canvas id="atmos" aria-hidden="true"></canvas>
      <!-- the sky: one body at a time, clipped at the horizon so it sets behind the dunes. No faces (gate 1). -->
      <div id="skybox">
        <button id="body" type="button" hidden>
          <span class="starglow" aria-hidden="true"></span>
          <img class="b-moon" src="../images/games/ibrahim/moon.webp" alt="" draggable="false">
          <img class="b-sun" src="../images/games/ibrahim/sun.webp" alt="" draggable="false">
        </button>
      </div>
      <!-- Ibrahim's tent: the guests are never drawn; their place is the mat (gate 1) -->
      <div class="tentprops">
        <span class="matglow" aria-hidden="true"></span>
        <button class="door" id="curtain" type="button" hidden aria-label="The curtain to the household" data-ar-label="الستارة إلى أهل البيت"><span class="chip" data-ar="إلى أهل البيت">To the household</span></button>
        <button class="spot" id="spotNear" type="button" hidden aria-label="Near the guests, on their mat" data-ar-label="قريباً من الضيوف، على مجلسهم"><span class="chip" data-ar="قريباً من الضيوف">Near the guests</span></button>
        <button class="spot" id="spotFar" type="button" hidden aria-label="The far corner" data-ar-label="الركن البعيد"><span class="chip" data-ar="الركن البعيد">The far corner</span></button>
        <button class="dish" id="dishBest" type="button" hidden aria-label="A fat, roasted calf on a big platter" data-ar-label="عجل سمين مشويّ على صينية كبيرة">
          <img src="../images/games/ibrahim/platter.webp" alt="" draggable="false"><span class="chip" data-ar="عجل سمين مشويّ">A fat, roasted calf</span></button>
        <button class="dish" id="dishCrust" type="button" hidden aria-label="A dry crust of bread" data-ar-label="قطعة خبز يابسة">
          <img src="../images/games/ibrahim/bread.webp" alt="" draggable="false"><span class="chip" data-ar="قطعة خبز يابسة">A dry crust of bread</span></button>
      </div>
    </div>
  </div>
  <div class="wipe" aria-hidden="true"></div>

  <!-- gold-ruled frame with girih corners (one line ornament, no text) -->
  <svg class="frame" aria-hidden="true" preserveAspectRatio="none">
    <rect class="f1" x="10" y="10" width="0" height="0" rx="16"/><rect class="f2" x="16" y="16" width="0" height="0" rx="12"/>
  </svg>
  <svg class="corner c-ts" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>
  <svg class="corner c-te" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>
  <svg class="corner c-bs" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>
  <svg class="corner c-be" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>

  <!-- ================= HUD ================= -->
  <header class="hud-top">
    <a class="tbtn back" href="../story-prophet-ibrahim.html" aria-label="Back to the story" data-ar-label="العودة إلى القصة">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="dirarrow" d="M15 5l-7 7 7 7"/></svg><span data-ar="القصة">Story</span>
    </a>
    <div class="beads" id="beads" role="img" aria-label="" hidden></div>
    <div class="tools" role="toolbar" aria-label="Game settings" data-ar-label="إعدادات اللعبة">
      <button class="tbtn icon" id="soundBtn" type="button" aria-pressed="true" aria-label="Sounds on" data-ar-label="الأصوات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on-only" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off-only" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="tbtn icon" id="bedBtn" type="button" aria-pressed="false" aria-label="Bedtime mode: darker and quieter" data-ar-label="وضع النوم: أهدأ وأغمق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="tbtn lang" id="langBtn" type="button" lang="ar">عربي</button>
    </div>
  </header>

  <!-- letting time pass: a native range, so it is keyboard and screen-reader friendly -->
  <div class="timebar" id="timebar" hidden>
    <span class="tlabel t0" id="t0"></span>
    <input type="range" id="time" min="0" max="100" step="5" value="0" aria-label="Let time pass" data-ar-label="دع الوقت يمضي">
    <span class="tlabel t1" id="t1"></span>
  </div>

  <!-- "Allah made them all": a parchment cartouche in the HUD (never an object in the sky) -->
  <div class="made" id="made" hidden>
    <p class="madeT" data-ar="خلقها الله">Created by Allah</p>
    <div class="slots"><span class="slot" data-k="star"></span><span class="slot" data-k="moon"></span><span class="slot" data-k="sun"></span></div>
  </div>
  <div class="tokens" id="tokens" hidden>
    <button class="token" type="button" data-k="star" aria-label="The star" data-ar-label="النجم"><span class="starglow" aria-hidden="true"></span></button>
    <button class="token" type="button" data-k="moon" aria-label="The moon" data-ar-label="القمر"><img src="../images/games/ibrahim/moon.webp" alt="" draggable="false"></button>
    <button class="token" type="button" data-k="sun" aria-label="The sun" data-ar-label="الشمس"><img src="../images/games/ibrahim/sun.webp" alt="" draggable="false"></button>
  </div>

  <!-- the story page's own sentences (reported speech), in a plain panel (not scripture styling) -->
  <div class="quote" id="qShow" hidden><span class="words" data-ar="{{R:IBR_SHOWED:ar}}">{{R:IBR_SHOWED:en}}</span><span class="more" data-ar="{{R:IBR_DECLARE:ar}}">{{R:IBR_DECLARE:en}}</span></div>

  <div class="ribbon" role="status" aria-live="polite">
    <button class="listen" id="listenBtn" type="button" hidden aria-label="Listen to Baba read this part" data-ar-label="استمع إلى هذا الجزء بصوت بابا">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <p id="say"></p>
  </div>

  <div class="choices" id="choices" hidden></div>
  <div class="actrow" id="actRow" hidden><button class="btn gold" id="actBtn" type="button"></button></div>

  <!-- parent pause: a parchment page beside the still scene -->
  <div class="sheet" id="pause" hidden>
    <div class="page" role="dialog" aria-modal="true" aria-labelledby="pauseQ">
      <svg class="star8" viewBox="0 0 40 40" aria-hidden="true"><use href="#star8"/></svg>
      <p class="kicker" data-ar="لحظة حوار مع الوالدين">Parent pause</p>
      <p class="sub" data-ar="توقّفا قليلاً واسألا معاً:">Stop for a moment and ask together:</p>
      <h2 id="pauseQ"></h2>
      <p class="idea" id="pauseHint"></p>
      <button class="btn gold" id="pauseGo" type="button"><span data-ar="تحدّثنا، لنكمل">We talked, carry on</span></button>
    </div>
  </div>

  <!-- the calm reward moment and ending -->
  <div class="reward" id="reward" aria-hidden="true">
    <div class="lamp"></div>
    <svg class="shamsa" viewBox="-100 -100 200 200"><circle class="disc" r="94"/><g id="shamsaG"></g></svg>
  </div>
  <div class="sheet end" id="ending" hidden>
    <div class="page" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <svg class="star8" viewBox="0 0 40 40" aria-hidden="true"><use href="#star8"/></svg>
      <h2 id="endTitle" data-ar="الله وحده، وقلبٌ كريم">Only Allah, and a generous heart</h2>
      <p id="endBody"></p>
      <div class="cartouche">
        <p class="kicker" data-ar="{{R:IBR_HEAD:ar}}">{{R:IBR_HEAD:en}}</p>
        <p class="dua" lang="ar" dir="rtl">{{S:IBR_DUA}}</p>
        <p class="dua-tr" data-ar="{{R:IBR_TR:ar}}">{{R:IBR_TR:en}}</p>
      </div>
      <div class="endrow">
        <button class="btn gold" id="againBtn" type="button"><span data-ar="لنلعب معاً مرة أخرى">Play together again</span></button>
        <a class="btn ghost" href="../story-prophet-ibrahim.html"><span data-ar="العودة إلى القصة">Back to the story</span></a>
      </div>
      <label class="tier"><input type="checkbox" id="tierBox"> <span data-ar="في المرة القادمة: يشرح الطفل كل جواب بكلماته قبل أن يختار">Next time: the child explains each answer in their own words before tapping</span></label>
    </div>
  </div>
  <p class="sr-only" id="srNote" aria-live="polite"></p>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="girih" fill="none" stroke-width="1.6">
      <path d="M8 8h64M8 8v64" />
      <path d="M8 30 L30 8 M8 52 L52 8" opacity=".55"/>
      <path d="M22 22 l8 -10 l8 10 l-8 10z M22 22 l-10 8 l10 8 l10 -8z" />
      <circle cx="30" cy="30" r="3.2" />
    </g>
    <g id="star8" fill="none" stroke-width="1.4">
      <rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>
</svg>
<script src="../vendor/pixi/pixi.min.js" defer></script>
<script src="ibrahim/ibrahim.js" defer></script>
</body>
</html>
