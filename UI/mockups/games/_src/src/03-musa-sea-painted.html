<!DOCTYPE html>
<!--
  GAME 03 - The Path Through the Sea (Musa). The second painted game (2026-11-06). Lives at UI/games/musa-sea.html
  (built from this file by UI/mockups/games/_src/build.py). NOT linked from the story or the hub until the scholar's
  gates 2 (art) and 3 (build) pass. The CSS-shape mockup stays at mockups/games/03-musa-sea.html.
  Learning goal: After playing, the child can say that when the believers were trapped and afraid, Musa trusted that
  Allah was with him, and that we can answer fear with "Allah is with us".
  Core loop: carry a lantern and walk with the believers, step by step, along the dry path Allah opened; at moments of
  fear, choose the trusting answer and the lantern glows warmer. Nothing is counted.
  Gate-1 rulings kept (claudeteam/reviews/game-musa-sea.md): Allah split the sea by His command (narrated; the child's
  button only starts the narration); the child walks WITH the believers and never leads; Allah's words only as indirect
  speech; no counted trust; Musa, the believers and the army are never drawn (the believers are lantern-lights);
  the closing of the sea is a calm crossfade with no army, no bodies and no triumph sound; one- or two-note chimes only.
  Art: UI/images/games/musa/ (prompts and seeds: UI/scripts/specs/games/musa.py, claudeteam/reviews/game-musa-art.md).
  Engine: painted DOM planes + DOM HUD, one PixiJS canvas for water shimmer, stars, fish, footprints and motes
  (claudeteam/reviews/game-engine-choice-2026-11-04.md). The dua and both quotations are copied from the story page.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14383A">
<title>The Path Through the Sea - Islamic Kids</title>
<link rel="preload" href="../images/games/musa/plate-shore-land.webp" as="image" media="(min-aspect-ratio: 4/5)">
<link rel="preload" href="../images/games/musa/plate-shore-port.webp" as="image" media="(max-aspect-ratio: 4/5)">
<link rel="stylesheet" href="musa/musa.css">
</head>
<body>
<div id="app" class="phase-camp">
  <!-- ================= the world: painted planes, props and the atmosphere canvas ================= -->
  <div id="viewport">
    <div id="world" role="group" aria-label="The shore of the sea at night" data-ar-label="شاطئ البحر في الليل">
      <div class="plates" aria-hidden="true">
        <img class="plate p-shore on" data-state="shore" alt="" decoding="async">
        <img class="plate p-split" data-state="split" alt="" decoding="async">
        <img class="plate p-dawn" data-state="dawn" alt="" decoding="async">
        <img class="plate p-calm" data-state="calm" alt="" decoding="async">
      </div>
      <div class="dim" aria-hidden="true"></div>
      <span class="wall w0" aria-hidden="true"></span><span class="wall w1" aria-hidden="true"></span>
      <canvas id="atmos" aria-hidden="true"></canvas>
      <!-- the believers' camp: things only, never people (gate 1) -->
      <div class="camp" aria-hidden="true">
        <img class="tent t1" src="../images/games/musa/tent.webp" alt="" draggable="false">
        <img class="tent t2" src="../images/games/musa/tent.webp" alt="" draggable="false">
        <img class="bundle" src="../images/games/musa/bundle.webp" alt="" draggable="false">
      </div>
      <div id="marks" aria-hidden="true"></div>
      <div id="trail" aria-hidden="true"></div>
      <button id="stepTarget" type="button" hidden aria-label="The next step on the path" data-ar-label="الخطوة التالية على الطريق"></button>
      <div id="lantern" role="button" tabindex="0" aria-label="Your lantern. Drag it to the glowing step, or press Enter to walk on." data-ar-label="فانوسك. اسحبه إلى الخطوة المضيئة، أو اضغط Enter لتمشي.">
        <span class="glow" aria-hidden="true"></span>
        <img src="../images/games/musa/lantern.webp" alt="" draggable="false">
      </div>
      <img class="fg reeds r1" src="../images/games/musa/reeds.webp" alt="" aria-hidden="true" draggable="false">
      <img class="fg reeds r2" src="../images/games/musa/reeds.webp" alt="" aria-hidden="true" draggable="false">
    </div>
  </div>

  <!-- gold-ruled frame with girih corners (one line ornament, no text) -->
  <svg class="frame" aria-hidden="true" preserveAspectRatio="none">
    <rect class="f1" x="10" y="10" width="0" height="0" rx="16"/><rect class="f2" x="16" y="16" width="0" height="0" rx="12"/>
  </svg>
  <svg class="corner c-ts" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>
  <svg class="corner c-te" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>
  <svg class="corner c-bs" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>
  <svg class="corner c-be" viewBox="0 0 80 80" aria-hidden="true"><use href="#girih"/></svg>

  <!-- ================= HUD ================= -->
  <header class="hud-top">
    <a class="tbtn back" href="../story-prophet-musa.html" aria-label="Back to the story" data-ar-label="العودة إلى القصة">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="dirarrow" d="M15 5l-7 7 7 7"/></svg><span data-ar="القصة">Story</span>
    </a>
    <div class="beads" id="beads" role="img" aria-label="" hidden></div>
    <div class="tools" role="toolbar" aria-label="Game settings" data-ar-label="إعدادات اللعبة">
      <button class="tbtn icon" id="soundBtn" type="button" aria-pressed="true" aria-label="Sounds on" data-ar-label="الأصوات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on-only" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off-only" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="tbtn icon" id="bedBtn" type="button" aria-pressed="false" aria-label="Bedtime mode: darker and quieter" data-ar-label="وضع النوم: أهدأ وأغمق">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="tbtn lang" id="langBtn" type="button" lang="ar">عربي</button>
    </div>
  </header>

  <!-- the people's cry and Musa's reply: the story page's own wording, in a plain panel (not scripture styling) -->
  <div class="quote" id="qCry" hidden><span class="who" data-ar="صاح الناس:">The people cried:</span><span class="words" data-ar="{{R:MUSA_CRY:ar}}">{{R:MUSA_CRY:en}}</span></div>
  <div class="quote" id="qReply" hidden><span class="who" data-ar="لكن موسى طمأنهم بهدوء وثقة،">But Musa said calmly:</span><span class="words" data-ar="{{R:MUSA_REPLY:ar}}">{{R:MUSA_REPLY:en}}</span></div>

  <div class="ribbon" role="status" aria-live="polite">
    <button class="listen" id="listenBtn" type="button" hidden aria-label="Listen to Baba read this part" data-ar-label="استمع إلى هذا الجزء بصوت بابا">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <p id="say"></p>
  </div>

  <div class="choices" id="choices" hidden></div>
  <div class="actrow" id="actRow" hidden><button class="btn gold" id="actBtn" type="button"></button></div>

  <!-- parent pause: a parchment page beside the still scene -->
  <div class="sheet" id="pause" hidden>
    <div class="page" role="dialog" aria-modal="true" aria-labelledby="pauseQ">
      <svg class="star8" viewBox="0 0 40 40" aria-hidden="true"><use href="#star8"/></svg>
      <p class="kicker" data-ar="لحظة حوار مع الوالدين">Parent pause</p>
      <p class="sub" data-ar="توقّفا قليلاً واسألا معاً:">Stop for a moment and ask together:</p>
      <h2 id="pauseQ"></h2>
      <p class="idea" id="pauseHint"></p>
      <button class="btn gold" id="pauseGo" type="button"><span data-ar="تحدّثنا، لنكمل">We talked, carry on</span></button>
    </div>
  </div>

  <!-- the calm reward moment and ending -->
  <div class="reward" id="reward" aria-hidden="true">
    <div class="lamp"></div>
    <svg class="shamsa" viewBox="-100 -100 200 200"><circle class="disc" r="94"/><g id="shamsaG"></g></svg>
  </div>
  <div class="sheet end" id="ending" hidden>
    <div class="page" role="dialog" aria-modal="true" aria-labelledby="endTitle">
      <svg class="star8" viewBox="0 0 40 40" aria-hidden="true"><use href="#star8"/></svg>
      <h2 id="endTitle" data-ar="الله يجعل دائماً مخرجاً">Allah always makes a way</h2>
      <p id="endBody"></p>
      <div class="cartouche">
        <p class="kicker" data-ar="{{R:MUSA_HEAD:ar}}">{{R:MUSA_HEAD:en}}</p>
        <p class="dua" lang="ar" dir="rtl">{{S:MUSA_DUA}}</p>
        <p class="dua-tr" data-ar="{{R:MUSA_TR:ar}}">{{R:MUSA_TR:en}}</p>
      </div>
      <div class="endrow">
        <button class="btn gold" id="againBtn" type="button"><span data-ar="لنلعب معاً مرة أخرى">Play together again</span></button>
        <a class="btn ghost" href="../story-prophet-musa.html"><span data-ar="العودة إلى القصة">Back to the story</span></a>
      </div>
      <label class="tier"><input type="checkbox" id="tierBox"> <span data-ar="في المرة القادمة: طريق أطول ولحظة شجاعة إضافية">Next time: a longer path with one more brave moment</span></label>
    </div>
  </div>
  <p class="sr-only" id="srNote" aria-live="polite"></p>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="girih" fill="none" stroke-width="1.6">
      <path d="M8 8h64M8 8v64" />
      <path d="M8 30 L30 8 M8 52 L52 8" opacity=".55"/>
      <path d="M22 22 l8 -10 l8 10 l-8 10z M22 22 l-10 8 l10 8 l10 -8z" />
      <circle cx="30" cy="30" r="3.2" />
    </g>
    <g id="star8" fill="none" stroke-width="1.4">
      <rect x="8" y="8" width="24" height="24"/><rect x="8" y="8" width="24" height="24" transform="rotate(45 20 20)"/>
      <circle cx="20" cy="20" r="4"/>
    </g>
  </defs>
</svg>
<script src="../vendor/pixi/pixi.min.js" defer></script>
<script src="musa/musa.js" defer></script>
</body>
</html>
